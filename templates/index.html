<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comment Wall</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml" />
    <!-- Fonts are served from this site, so visitors' browsers don't contact Google -->
    <link rel="stylesheet" href="{{ url_for('static', filename='fonts/fonts.css') }}" />
    <script>
      // Set the theme before anything is drawn, so a dark theme doesn't flash light first.
      // A saved choice wins; without one, follow the device's light/dark setting.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('theme');
        } catch (e) {}
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
    <style>
      /* ================ Theme tokens ================ */
      :root {
        --bg: #f4f3ef;
        --surface: #ffffff;
        --border: #e2dfd8;
        --border-strong: #d6d3cc;
        --input-border: #a8a29e;
        --text: #18181b;
        --muted: #57534e;
        --accent: #1d4ed8;
        --live: #15803d;
        --paused: #b45309;
        --error: #9a3412;
        --error-bg: #fff4ed;
        --primary-bg: #18181b;
        --primary-text: #ffffff;
        --danger: #b91c1c;
        --focus: #1d4ed8;
      }
      html.dark {
        --bg: #141414;
        --surface: #1f1f1f;
        --border: #2e2e2e;
        --border-strong: #3d3d3d;
        --input-border: #6b6b6b;
        --text: #ededed;
        --muted: #b0aaa4;
        --accent: #8ab4ff;
        --live: #4ade80;
        --paused: #fbbf24;
        --error: #fdba74;
        --error-bg: #2b1a0f;
        --primary-bg: #ededed;
        --primary-text: #141414;
        --danger: #f87171;
        --focus: #8ab4ff;
      }

      /* ================ Base ================ */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
        transition: background 0.3s, color 0.3s;
      }
      .page {
        max-width: 640px;
        margin: 0 auto;
        padding: 40px 16px 64px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      .btn {
        min-height: 44px;
        padding: 0 14px;
        border-radius: 8px;
        border: 1px solid var(--border-strong);
        background: var(--surface);
        font-size: 14px;
      }
      .icon-btn {
        width: 44px;
        height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      .btn-primary {
        min-height: 44px;
        padding: 0 20px;
        border-radius: 8px;
        border: none;
        background: var(--primary-bg);
        color: var(--primary-text);
        font-size: 15px;
        font-weight: 600;
      }

      .btn-primary:disabled {
        opacity: 0.6;
        cursor: default;
      }

      /* ================ Header ================ */
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      h1 {
        margin: 0;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .status-line {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-top: 4px;
        font-size: 13px;
        color: var(--muted);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--live);
      }
      .dot.paused {
        background: var(--paused);
      }
      .admin-status:empty {
        display: none;
      }
      .admin-status::before {
        content: '·';
        margin-right: 8px;
      }
      .admin-status.error {
        color: var(--error);
      }
      .controls {
        display: flex;
        gap: 8px;
      }

      /* ================ Form ================ */
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
      }
      #commentForm {
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      label {
        font-size: 15px;
        font-weight: 600;
      }
      textarea,
      dialog input {
        width: 100%;
        font: inherit;
        font-size: 16px;
        line-height: 1.5;
        padding: 12px;
        border: 1px solid var(--input-border);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text);
      }
      textarea {
        resize: vertical;
        min-height: 110px;
      }
      textarea::placeholder {
        color: var(--muted);
      }
      .form-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .hint {
        font-size: 13px;
        color: var(--muted);
      }
      .form-actions {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .char-count {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 13px;
        color: var(--muted);
      }
      .error-message {
        font-size: 14px;
        color: var(--error);
        background: var(--error-bg);
        border-radius: 8px;
        padding: 10px 12px;
      }
      .error-message:empty {
        display: none;
      }

      /* ================ Comments ================ */
      .list-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
      }
      h2 {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
      }
      #comments {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .comment {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        transition: background 0.3s;
      }
      .comment.mine {
        border: 2px solid var(--accent);
        padding: 13px 15px;
      }
      .comment-meta {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--muted);
      }
      .comment-author {
        font-weight: 600;
      }
      .comment.mine .comment-author {
        color: var(--accent);
      }
      .comment-text {
        margin: 0;
        font-size: 16px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .delete-btn {
        display: none;
        margin-left: auto;
        min-height: 32px;
        padding: 0 10px;
        border-radius: 6px;
        border: 1px solid var(--danger);
        background: transparent;
        color: var(--danger);
        font-size: 13px;
      }
      .admin-mode .delete-btn {
        display: inline-block;
      }
      #loadOlder {
        align-self: center;
        background: transparent;
      }
      #loadOlder[hidden] {
        display: none;
      }

      /* ================ Admin sign-in dialog ================ */
      dialog {
        width: min(360px, 90vw);
        padding: 20px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface);
        color: var(--text);
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.4);
      }
      #adminForm {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <div>
          <h1>Comment Wall</h1>
          <div class="status-line">
            <span id="live-dot" class="dot" aria-hidden="true"></span>
            <span id="live-status">Live</span>
            <!-- Admin sign-in result -->
            <span id="admin-status" class="admin-status" role="status"></span>
          </div>
        </div>
        <div class="controls">
          <!-- Cat chaos trigger -->
          <button id="catJam" class="btn" type="button">Make fun</button>
          <!-- Theme switch -->
          <button id="themeToggle" class="btn icon-btn" type="button" aria-label="Switch to dark theme"></button>
          <!-- Admin Mode always on the right -->
          <button class="btn icon-btn" type="button" aria-label="Admin sign in" onclick="enableAdmin()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
          </button>
        </div>
      </header>

      <dialog id="adminDialog">
        <form id="adminForm" method="dialog">
          <label for="admin-token">Admin token</label>
          <input type="password" id="admin-token" autocomplete="current-password" required />
          <div class="dialog-actions">
            <button type="button" class="btn" id="adminCancel">Cancel</button>
            <button type="submit" class="btn-primary">Sign in</button>
          </div>
        </form>
      </dialog>

      <form id="commentForm" class="card">
        <label for="comment-input">Your comment</label>
        <textarea name="text" id="comment-input" placeholder="Leave a comment..." maxlength="500" rows="4" required></textarea>
        <div class="form-row">
          <span class="hint">Anonymous · be kind</span>
          <div class="form-actions">
            <span id="char-count" class="char-count">0 / 500</span>
            <button type="submit" class="btn-primary">Post</button>
          </div>
        </div>
        <div id="form-error" class="error-message" role="alert"></div>
      </form>

      <section aria-labelledby="comments-heading" style="display: flex; flex-direction: column; gap: 10px">
        <div class="list-head">
          <h2 id="comments-heading">Comments</h2>
          <span class="hint">Newest first</span>
        </div>
        <div id="comments">
          {% for comment in comments %}
          <article class="comment" data-id="{{ comment.id }}">
            <div class="comment-meta">
              <span class="comment-author">Anonymous</span>
              {% if comment.created_at %}<span>·</span><time datetime="{{ comment.created_at.isoformat() }}Z">{{ comment.created_at.strftime('%Y-%m-%d %H:%M') }} UTC</time>{% endif %}
              <button class="delete-btn" type="button" onclick="deleteComment({{ comment.id }})">Delete</button>
            </div>
            <p class="comment-text">{{ comment.text }}</p>
          </article>
          {% endfor %}
        </div>
        <button id="loadOlder" class="btn" type="button" hidden>Load older comments</button>
      </section>
    </div>

    <script>
      // ===== Dark mode toggle =====
      const themeToggle = document.getElementById('themeToggle');
      const MOON =
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>';
      const SUN =
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>';
      const root = document.documentElement; // the theme class is set in <head>
      function updateThemeButton() {
        const dark = root.classList.contains('dark');
        themeToggle.innerHTML = dark ? SUN : MOON;
        themeToggle.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
      }
      updateThemeButton();
      themeToggle.addEventListener('click', () => {
        root.classList.toggle('dark');
        try {
          localStorage.setItem('theme', root.classList.contains('dark') ? 'dark' : 'light');
        } catch (e) {}
        updateThemeButton();
      });

      // ===== Admin mode =====
      let adminToken = null;
      const adminDialog = document.getElementById('adminDialog');
      const adminForm = document.getElementById('adminForm');
      const adminInput = document.getElementById('admin-token');
      const adminStatus = document.getElementById('admin-status');

      function setAdminStatus(text, isError) {
        adminStatus.textContent = text;
        adminStatus.classList.toggle('error', !!isError);
      }

      function enableAdmin() {
        adminInput.value = '';
        adminDialog.showModal();
      }
      document.getElementById('adminCancel').addEventListener('click', () => adminDialog.close());

      adminForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const token = adminInput.value;
        if (!token) return;
        let res;
        try {
          res = await fetch('/admin-verify', {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}` },
          });
        } catch (err) {
          adminDialog.close();
          setAdminStatus('No connection. Try again.', true);
          return;
        }
        adminDialog.close();
        if (res.ok) {
          adminToken = token;
          document.body.classList.add('admin-mode');
          setAdminStatus('Admin mode on');
          refreshComments();
        } else if (res.status === 429) {
          setAdminStatus('Too many attempts. Try again in a minute.', true);
        } else {
          setAdminStatus('Wrong admin token.', true);
        }
      });

      // ===== Own comments (marked "You") =====
      // Kept in this browser only; the wall itself stays anonymous.
      let myIds = [];
      try {
        myIds = JSON.parse(localStorage.getItem('myComments') || '[]');
      } catch (e) {}
      function rememberMine(id) {
        myIds = myIds.concat(id).slice(-200);
        try {
          localStorage.setItem('myComments', JSON.stringify(myIds));
        } catch (e) {}
      }

      // ===== Posting comments =====
      const form = document.getElementById('commentForm');
      const errorDiv = document.getElementById('form-error');
      const commentsDiv = document.getElementById('comments');
      const charCount = document.getElementById('char-count');
      const submitBtn = form.querySelector('button[type="submit"]');
      const MAX_LENGTH = 500;

      function updateCharCount() {
        charCount.textContent = `${form.text.value.length} / ${MAX_LENGTH}`;
      }
      form.text.addEventListener('input', updateCharCount);

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorDiv.textContent = '';
        const text = form.text.value.trim();
        if (!text) {
          errorDiv.textContent = 'Comment text is required.';
          return;
        }
        // Block a second click while this request is on its way
        submitBtn.disabled = true;
        let res;
        try {
          res = await fetch('/comments', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text }),
          });
        } catch (err) {
          // The text stays in the field, so nothing is lost
          errorDiv.textContent = "No connection. Your comment wasn't sent. Try again.";
          return;
        } finally {
          submitBtn.disabled = false;
        }
        if (res.ok) {
          const created = await res.json();
          rememberMine(created.id);
          form.text.value = '';
          updateCharCount();
          refreshComments(); // show the new comment now, not on the next poll
        } else if (res.status === 429) {
          errorDiv.textContent = "You're posting too fast. Try again in a few seconds.";
        } else {
          const data = await res.json().catch(() => ({}));
          errorDiv.textContent = data.error || 'Failed to post comment.';
        }
      });

      // ===== Deleting comments =====
      async function deleteComment(id) {
        errorDiv.textContent = '';
        if (!adminToken) {
          errorDiv.textContent = 'Unauthorized to delete.';
          return;
        }
        let res;
        try {
          res = await fetch(`/comments/${id}`, {
            method: 'DELETE',
            headers: { Authorization: `Bearer ${adminToken}` },
          });
        } catch (err) {
          errorDiv.textContent = "No connection. The comment wasn't deleted.";
          return;
        }
        if (res.ok) {
          older = older.filter((c) => c.id !== id);
          refreshComments();
        } else {
          const data = await res.json().catch(() => ({}));
          errorDiv.textContent = data.error || 'Failed to delete.';
        }
      }

      // ===== Showing comments =====
      const PAGE_SIZE = 50;
      const loadOlderBtn = document.getElementById('loadOlder');
      const liveDot = document.getElementById('live-dot');
      const liveStatus = document.getElementById('live-status');
      let newest = []; // the latest page, refreshed by polling
      let older = []; // pages added with "Load older comments"
      let moreOnServer = false;
      let lastUpdate = null;

      function formatAgo(ms) {
        const seconds = ms / 1000;
        if (seconds < 60) return 'just now';
        if (seconds < 3600) return `${Math.floor(seconds / 60)} min ago`;
        if (seconds < 86400) return `${Math.floor(seconds / 3600)} h ago`;
        return null;
      }

      function formatTime(iso) {
        const ms = Date.now() - new Date(iso).getTime();
        return formatAgo(ms) || new Date(iso).toLocaleDateString();
      }

      function setLive(state) {
        liveDot.classList.toggle('paused', state !== 'ok');
        if (state === 'limited') {
          liveStatus.textContent = 'Live updates paused: too many requests';
        } else if (state === 'offline') {
          liveStatus.textContent = 'Offline · retrying';
        } else {
          liveStatus.textContent = `Live · updated ${formatAgo(Date.now() - lastUpdate) || 'a while ago'}`;
        }
      }

      function renderComments() {
        const oldestNewId = newest.length ? newest[newest.length - 1].id : Infinity;
        const list = newest.concat(older.filter((c) => c.id < oldestNewId));
        commentsDiv.innerHTML = '';
        list.forEach((c) => {
          const mine = myIds.includes(c.id);
          const el = document.createElement('article');
          el.className = mine ? 'comment mine' : 'comment';
          el.dataset.id = c.id;

          // Build nodes instead of innerHTML string — comment text is set via
          // textContent, so markup in a comment is shown as text, not executed.
          const meta = document.createElement('div');
          meta.className = 'comment-meta';
          const author = document.createElement('span');
          author.className = 'comment-author';
          author.textContent = mine ? 'You' : 'Anonymous';
          meta.appendChild(author);
          if (c.created_at) {
            const sep = document.createElement('span');
            sep.textContent = '·';
            const timeEl = document.createElement('time');
            timeEl.dateTime = c.created_at;
            timeEl.title = new Date(c.created_at).toLocaleString();
            timeEl.textContent = formatTime(c.created_at);
            meta.append(sep, timeEl);
          }
          if (adminToken) {
            const btn = document.createElement('button');
            btn.className = 'delete-btn';
            btn.type = 'button';
            btn.textContent = 'Delete';
            btn.addEventListener('click', () => deleteComment(c.id));
            meta.appendChild(btn);
          }

          const textEl = document.createElement('p');
          textEl.className = 'comment-text';
          textEl.textContent = c.text;

          el.append(meta, textEl);
          commentsDiv.appendChild(el);
        });
        loadOlderBtn.hidden = !moreOnServer;
      }

      // ===== Polling for updates =====
      async function refreshComments() {
        let res;
        try {
          res = await fetch(`/comments?limit=${PAGE_SIZE}`);
        } catch (err) {
          setLive('offline'); // the next poll tries again
          return;
        }
        if (res.status === 429) {
          setLive('limited');
          return;
        }
        if (!res.ok) return;
        newest = await res.json();
        lastUpdate = Date.now();
        setLive('ok');
        if (!older.length) moreOnServer = newest.length === PAGE_SIZE;
        renderComments();
      }

      loadOlderBtn.addEventListener('click', async () => {
        const all = newest.concat(older);
        if (!all.length) return;
        const oldestId = Math.min(...all.map((c) => c.id));
        let res;
        try {
          res = await fetch(`/comments?limit=${PAGE_SIZE}&before=${oldestId}`);
        } catch (err) {
          errorDiv.textContent = "No connection. Couldn't load older comments.";
          return;
        }
        if (!res.ok) return;
        const page = await res.json();
        older = older.concat(page);
        moreOnServer = page.length === PAGE_SIZE;
        renderComments();
      });

      refreshComments();
      setInterval(refreshComments, 5000);

      // ===== Cat chaos (toggle on the 🐱 Cat button): spinning cats + music =====
      let chaosOn = false;
      // references we must keep so we can tear everything down later
      let catTimer = null;
      let catAudio = null,
        catStyles = [];

      function startCatChaos() {
        chaosOn = true;

        // music — plays now because the click is the user gesture browsers require
        catAudio = document.createElement('audio');
        catAudio.src = '/static/cat.mp3';
        catAudio.loop = true;
        catAudio.volume = 0.25; // 25% volume
        document.body.appendChild(catAudio);
        catAudio.play().catch(() => {});

        // spin keyframes for the cat gifs
        const spinStyle = document.createElement('style');
        spinStyle.textContent = '@keyframes spin{to{transform:rotate(360deg)}}';
        document.head.appendChild(spinStyle);
        catStyles.push(spinStyle);

        // with "reduce motion" set on the device, the cats still appear but don't spin
        const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // spawn a spinning cat every 500ms; class 'cat-gif' lets us remove them all later
        catTimer = setInterval(() => {
          const gif = document.createElement('img');
          gif.className = 'cat-gif';
          gif.src = '/static/cat.gif';
          Object.assign(gif.style, {
            position: 'fixed',
            zIndex: 9999,
            width: '150px',
            animation: calm ? 'none' : 'spin 2s linear infinite',
            top: Math.random() * window.innerHeight + 'px',
            left: Math.random() * window.innerWidth + 'px',
            pointerEvents: 'none',
          });
          document.body.appendChild(gif);
          setTimeout(() => gif.remove(), 10000);
        }, 500);
      }

      function stopCatChaos() {
        chaosOn = false;

        // stop the spawn timer
        clearInterval(catTimer);

        // stop the music
        if (catAudio) {
          catAudio.pause();
          catAudio.remove();
          catAudio = null;
        }

        // remove the cats and the injected spin keyframes
        document.querySelectorAll('.cat-gif').forEach((el) => el.remove());
        catStyles.forEach((s) => s.remove());
        catStyles = [];
      }

      document.getElementById('catJam').addEventListener('click', () => {
        chaosOn ? stopCatChaos() : startCatChaos();
      });
    </script>
  </body>
</html>
