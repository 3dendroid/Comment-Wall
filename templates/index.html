<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comment Wall</title>
    <style>
      /* ================ box-sizing ================ */
      html {
        box-sizing: border-box;
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }

      /* ================ Theme variables & base ================ */
      body {
        font-family: sans-serif;
        max-width: 600px;
        margin: 20px auto;
        padding: 0 10px;
        background: #fff;
        color: #000;
        transition: background 0.3s, color 0.3s;
      }
      body.dark {
        background: #121212;
        color: #eee;
      }

      /* ================ Header & controls ================ */
      h1 {
        text-align: center;
        font-size: 1.8rem;
      }
      .controls {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-bottom: 10px;
      }
      /* common button style */
      .controls button,
      .form-actions button,
      dialog button {
        background: #e0e0e0;
        border: 1px solid #ccc;
        padding: 6px 12px;
        border-radius: 4px;
        font-size: 0.9rem;
        cursor: pointer;
        transition: background 0.3s, color 0.3s;
      }
      body.dark .controls button,
      body.dark .form-actions button,
      body.dark dialog button {
        background: #2e2e2e;
        border-color: #555;
        color: #eee;
      }

      /* ================ Form styling ================ */
      form {
        margin-bottom: 20px;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
      }
      textarea,
      dialog input {
        width: 100%;
        height: 80px;
        padding: 10px;
        font-size: 1rem;
        resize: vertical;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: inherit;
        color: inherit;
        transition: background 0.3s, color 0.3s, border-color 0.3s;
      }
      body.dark textarea,
      body.dark dialog input {
        border-color: #444;
      }
      .form-actions {
        display: flex;
        align-items: center;
        margin-top: 10px;
      }
      .error-message {
        margin-left: 10px;
        color: #c62828;
        font-size: 0.9rem;
      }
      body.dark .error-message {
        color: #ff8a80;
      }
      .char-count {
        margin-left: auto;
        font-size: 0.85rem;
        color: #666;
      }
      body.dark .char-count {
        color: #aaa;
      }
      .admin-status {
        margin-right: auto;
        align-self: center;
        font-size: 0.9rem;
      }
      .admin-status.error {
        color: #c62828;
      }
      body.dark .admin-status.error {
        color: #ff8a80;
      }

      /* ================ Admin sign-in dialog ================ */
      dialog {
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 16px;
        width: min(360px, 90vw);
        background: #fff;
        color: #000;
      }
      body.dark dialog {
        background: #1e1e1e;
        color: #eee;
        border-color: #555;
      }
      dialog input {
        height: auto;
      }
      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 12px;
      }

      /* ================ Comments list ================ */
      .comment {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #f3f3f3;
        padding: 10px;
        margin-bottom: 10px;
        border-radius: 6px;
        word-break: break-word;
        transition: background 0.3s;
      }
      body.dark .comment {
        background: #1e1e1e;
      }
      .comment-text {
        flex-grow: 1;
        padding-right: 10px;
      }
      .comment-time {
        display: block;
        margin-top: 4px;
        font-size: 0.8rem;
        color: #666;
      }
      body.dark .comment-time {
        color: #aaa;
      }
      #loadOlder {
        display: block;
        margin: 10px auto;
      }
      #loadOlder[hidden] {
        display: none;
      }
      .delete-btn {
        background: #dc3545 !important;
        color: white !important;
        border: none !important;
        display: none;
      }
      .admin-mode .delete-btn {
        display: inline-block !important;
      }
    </style>
  </head>
  <body>
    <h1>🧱 Comment Wall</h1>

    <div class="controls">
      <!-- Admin sign-in result; kept apart from the comment form's errors -->
      <span id="admin-status" class="admin-status" role="status"></span>
      <!-- Cat chaos trigger -->
      <button id="catJam">🐱 Make fun</button>
      <!-- Theme switch -->
      <button id="themeToggle">🌙 Switch Theme</button>
      <!-- Admin Mode always on the right -->
      <button onclick="enableAdmin()">🔐 Admin Mode</button>
    </div>

    <dialog id="adminDialog">
      <form id="adminForm" method="dialog">
        <label for="admin-token">Admin token</label>
        <input type="password" id="admin-token" autocomplete="current-password" required />
        <div class="dialog-actions">
          <button type="button" id="adminCancel">Cancel</button>
          <button type="submit">Sign in</button>
        </div>
      </form>
    </dialog>

    <form id="commentForm">
      <label for="comment-input">Your comment</label>
      <textarea name="text" id="comment-input" placeholder="Leave a comment..." maxlength="500" required></textarea>
      <div class="form-actions">
        <button type="submit">Submit</button>
        <div id="form-error" class="error-message" role="alert"></div>
        <span id="char-count" class="char-count">0 / 500</span>
      </div>
    </form>

    <div id="comments">
      {% for comment in comments %}
      <div class="comment" data-id="{{ comment.id }}">
        <div class="comment-text">{{ comment.text }}{% if comment.created_at %}<time class="comment-time" datetime="{{ comment.created_at.isoformat() }}Z">{{ comment.created_at.strftime('%Y-%m-%d %H:%M') }} UTC</time>{% endif %}</div>
        <button class="delete-btn" onclick="deleteComment({{ comment.id }})">Delete</button>
      </div>
      {% endfor %}
    </div>
    <button id="loadOlder" type="button" hidden>Load older comments</button>

    <script>
      // ===== Dark mode toggle =====
      const themeToggle = document.getElementById('themeToggle');
      if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark');
      }
      function updateThemeButton() {
        const dark = document.body.classList.contains('dark');
        themeToggle.textContent = (dark ? '☀️' : '🌙') + ' Switch Theme';
      }
      updateThemeButton();
      themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('dark');
        localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
        updateThemeButton();
      });

      // ===== Admin mode =====
      let adminToken = null;
      const adminDialog = document.getElementById('adminDialog');
      const adminForm = document.getElementById('adminForm');
      const adminInput = document.getElementById('admin-token');
      const adminStatus = document.getElementById('admin-status');

      function setAdminStatus(text, isError) {
        adminStatus.textContent = text;
        adminStatus.classList.toggle('error', !!isError);
      }

      function enableAdmin() {
        adminInput.value = '';
        adminDialog.showModal();
      }
      document.getElementById('adminCancel').addEventListener('click', () => adminDialog.close());

      adminForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const token = adminInput.value;
        if (!token) return;
        const res = await fetch('/admin-verify', {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}` },
        });
        adminDialog.close();
        if (res.ok) {
          adminToken = token;
          document.body.classList.add('admin-mode');
          setAdminStatus('Admin mode on');
          refreshComments();
        } else if (res.status === 429) {
          setAdminStatus('Too many attempts. Try again in a minute.', true);
        } else {
          setAdminStatus('Wrong admin token.', true);
        }
      });

      // ===== Posting comments =====
      const form = document.getElementById('commentForm');
      const errorDiv = document.getElementById('form-error');
      const commentsDiv = document.getElementById('comments');
      const charCount = document.getElementById('char-count');
      const MAX_LENGTH = 500;

      function updateCharCount() {
        charCount.textContent = `${form.text.value.length} / ${MAX_LENGTH}`;
      }
      form.text.addEventListener('input', updateCharCount);

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorDiv.textContent = '';
        const text = form.text.value.trim();
        if (!text) {
          errorDiv.textContent = 'Comment text is required.';
          return;
        }
        const res = await fetch('/comments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text }),
        });
        if (res.ok) {
          form.text.value = '';
          updateCharCount();
          refreshComments(); // show the new comment now, not on the next poll
        } else if (res.status === 429) {
          errorDiv.textContent = "You're commenting too quickly. Please wait.";
        } else {
          const data = await res.json().catch(() => ({}));
          errorDiv.textContent = data.error || 'Failed to post comment.';
        }
      });

      // ===== Deleting comments =====
      async function deleteComment(id) {
        errorDiv.textContent = '';
        if (!adminToken) {
          errorDiv.textContent = 'Unauthorized to delete.';
          return;
        }
        const res = await fetch(`/comments/${id}`, {
          method: 'DELETE',
          headers: { Authorization: `Bearer ${adminToken}` },
        });
        if (res.ok) {
          older = older.filter((c) => c.id !== id);
          refreshComments();
        } else {
          const data = await res.json().catch(() => ({}));
          errorDiv.textContent = data.error || 'Failed to delete.';
        }
      }

      // ===== Showing comments =====
      const PAGE_SIZE = 50;
      const loadOlderBtn = document.getElementById('loadOlder');
      let newest = []; // the latest page, refreshed by polling
      let older = []; // pages added with "Load older comments"
      let moreOnServer = false;

      function formatTime(iso) {
        if (!iso) return '';
        const seconds = (Date.now() - new Date(iso).getTime()) / 1000;
        if (seconds < 60) return 'just now';
        if (seconds < 3600) return `${Math.floor(seconds / 60)} min ago`;
        if (seconds < 86400) return `${Math.floor(seconds / 3600)} h ago`;
        return new Date(iso).toLocaleDateString();
      }

      function renderComments() {
        const oldestNewId = newest.length ? newest[newest.length - 1].id : Infinity;
        const list = newest.concat(older.filter((c) => c.id < oldestNewId));
        commentsDiv.innerHTML = '';
        list.forEach((c) => {
          const el = document.createElement('div');
          el.className = 'comment';
          el.dataset.id = c.id;

          // Build nodes instead of innerHTML string — comment text is set via
          // textContent, so markup in a comment is shown as text, not executed.
          const textEl = document.createElement('div');
          textEl.className = 'comment-text';
          textEl.textContent = c.text;
          if (c.created_at) {
            const timeEl = document.createElement('time');
            timeEl.className = 'comment-time';
            timeEl.dateTime = c.created_at;
            timeEl.title = new Date(c.created_at).toLocaleString();
            timeEl.textContent = formatTime(c.created_at);
            textEl.appendChild(timeEl);
          }
          el.appendChild(textEl);

          if (adminToken) {
            const btn = document.createElement('button');
            btn.className = 'delete-btn';
            btn.textContent = 'Delete';
            btn.addEventListener('click', () => deleteComment(c.id));
            el.appendChild(btn);
          }

          commentsDiv.appendChild(el);
        });
        loadOlderBtn.hidden = !moreOnServer;
      }

      // ===== Polling for updates =====
      async function refreshComments() {
        const res = await fetch(`/comments?limit=${PAGE_SIZE}`);
        if (res.status === 429) {
          errorDiv.textContent = 'Live updates paused: too many requests. Reload the page later.';
          return;
        }
        if (!res.ok) return;
        newest = await res.json();
        if (!older.length) moreOnServer = newest.length === PAGE_SIZE;
        renderComments();
      }

      loadOlderBtn.addEventListener('click', async () => {
        const all = newest.concat(older);
        if (!all.length) return;
        const oldestId = Math.min(...all.map((c) => c.id));
        const res = await fetch(`/comments?limit=${PAGE_SIZE}&before=${oldestId}`);
        if (!res.ok) return;
        const page = await res.json();
        older = older.concat(page);
        moreOnServer = page.length === PAGE_SIZE;
        renderComments();
      });

      refreshComments();
      setInterval(refreshComments, 5000);

      // ===== Cat chaos (toggle on the 🐱 Cat button): spinning cats + music =====
      let chaosOn = false;
      // references we must keep so we can tear everything down later
      let catTimer = null;
      let catAudio = null,
        catStyles = [];

      function startCatChaos() {
        chaosOn = true;

        // music — plays now because the click is the user gesture browsers require
        catAudio = document.createElement('audio');
        catAudio.src = '/static/cat.mp3';
        catAudio.loop = true;
        catAudio.volume = 0.25; // 25% volume
        document.body.appendChild(catAudio);
        catAudio.play().catch(() => {});

        // spin keyframes for the cat gifs
        const spinStyle = document.createElement('style');
        spinStyle.textContent = '@keyframes spin{to{transform:rotate(360deg)}}';
        document.head.appendChild(spinStyle);
        catStyles.push(spinStyle);

        // spawn a spinning cat every 500ms; class 'cat-gif' lets us remove them all later
        catTimer = setInterval(() => {
          const gif = document.createElement('img');
          gif.className = 'cat-gif';
          gif.src = '/static/cat.gif';
          Object.assign(gif.style, {
            position: 'fixed',
            zIndex: 9999,
            width: '150px',
            animation: 'spin 2s linear infinite',
            top: Math.random() * window.innerHeight + 'px',
            left: Math.random() * window.innerWidth + 'px',
            pointerEvents: 'none',
          });
          document.body.appendChild(gif);
          setTimeout(() => gif.remove(), 10000);
        }, 500);
      }

      function stopCatChaos() {
        chaosOn = false;

        // stop the spawn timer
        clearInterval(catTimer);

        // stop the music
        if (catAudio) {
          catAudio.pause();
          catAudio.remove();
          catAudio = null;
        }

        // remove the cats and the injected spin keyframes
        document.querySelectorAll('.cat-gif').forEach((el) => el.remove());
        catStyles.forEach((s) => s.remove());
        catStyles = [];
      }

      document.getElementById('catJam').addEventListener('click', () => {
        chaosOn ? stopCatChaos() : startCatChaos();
      });
    </script>
  </body>
</html>
