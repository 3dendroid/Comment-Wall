<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comment Wall</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml" />
    <!-- Fonts are served from this site, so visitors' browsers don't contact Google -->
    <link rel="stylesheet" href="{{ url_for('static', filename='fonts/fonts.css') }}" />
    <!-- Runs before the page is drawn, so a dark theme doesn't flash light -->
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <div class="page">
      <header>
        <div>
          <h1>Comment Wall</h1>
          <div class="status-line">
            <span id="live-dot" class="dot" aria-hidden="true"></span>
            <span id="live-status">Live</span>
            <!-- Admin sign-in result -->
            <span id="admin-status" class="admin-status" role="status"></span>
          </div>
        </div>
        <div class="controls">
          <!-- Cat chaos trigger -->
          <button id="catJam" class="btn" type="button">Make fun</button>
          <!-- Theme switch -->
          <button id="themeToggle" class="btn icon-btn" type="button" aria-label="Switch to dark theme"></button>
          <!-- Admin Mode always on the right -->
          <button id="adminButton" class="btn icon-btn" type="button" aria-label="Admin sign in">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
          </button>
        </div>
      </header>

      <dialog id="adminDialog">
        <form id="adminForm" method="dialog">
          <label for="admin-token">Admin token</label>
          <input type="password" id="admin-token" autocomplete="current-password" required />
          <div class="dialog-actions">
            <button type="button" class="btn" id="adminCancel">Cancel</button>
            <button type="submit" class="btn-primary">Sign in</button>
          </div>
        </form>
      </dialog>

      <form id="commentForm" class="card">
        <label for="comment-input">Your comment</label>
        <textarea name="text" id="comment-input" placeholder="Leave a comment..." maxlength="500" rows="4" required></textarea>
        <div class="form-row">
          <span class="hint">Anonymous · be kind</span>
          <div class="form-actions">
            <span id="char-count" class="char-count">0 / 500</span>
            <button type="submit" class="btn-primary">Post</button>
          </div>
        </div>
        <div id="form-error" class="error-message" role="alert"></div>
      </form>

      <section class="comments-section" aria-labelledby="comments-heading">
        <div class="list-head">
          <h2 id="comments-heading">Comments</h2>
          <span class="hint">Newest first</span>
        </div>
        <div id="comments">
          {% for comment in comments %}
          <article class="comment" data-id="{{ comment.id }}">
            <div class="comment-meta">
              <span class="comment-author">Anonymous</span>
              {% if comment.created_at %}<span>·</span><time datetime="{{ comment.created_at.isoformat() }}Z">{{ comment.created_at.strftime('%Y-%m-%d %H:%M') }} UTC</time>{% endif %}
              <button class="delete-btn" type="button">Delete</button>
            </div>
            <p class="comment-text">{{ comment.text }}</p>
          </article>
          {% endfor %}
        </div>
        <button id="loadOlder" class="btn" type="button" hidden>Load older comments</button>
      </section>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
