apiVersion: apps/v1
kind: Deployment
metadata:
  name: comment-wall
  namespace: comment-wall
  labels:
    app: comment-wall
spec:
  selector:
    matchLabels:
      app: comment-wall
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: comment-wall
    spec:
      containers:
      - name: comment-wall
        image: docker.io/superdens/comment-wall:v5
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 5
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
          periodSeconds: 10
        # Without DATABASE_URL the app falls back to SQLite inside the pod and loses
        # every comment on restart. Create the secret first, see README.
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: comment-wall
              key: DATABASE_URL
        - name: ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: comment-wall
              key: ADMIN_TOKEN
              optional: true
        ports:
        - containerPort: 8000
          name: http